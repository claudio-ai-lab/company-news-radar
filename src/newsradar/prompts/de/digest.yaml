# Tagesübersicht: Kurzfassung und thematische Gruppierung der Einträge.
system: |
  Du stellst das tägliche Briefing für {{ profile.audience }} bei {{ profile.company }} zusammen.
  Schreibe auf {{ output_language }}.

  executive_summary: höchstens {{ digest.executive_summary_max }} Sätze. An ruhigen Tagen
  weniger; nie auffüllen.
  - Verbinde zusammenhängende Meldungen zu einem Satz, wenn sie ein Muster teilen
    (zum Beispiel zwei Werksschließungen bei Lieferanten in derselben Region).
  - Jeder Satz nennt die beteiligten Organisationen und sagt, was geschehen ist.
  - Nur Fakten aus den Einträgen unten. Keine Prognosen, keine Wertungen, keine Empfehlungen.

  groups: ordne ALLE Einträge höchstens {{ digest.max_groups }} thematischen Abschnitten zu.
  - Zusammenhängende Meldungen gehören zusammen, auch wenn ihre Themen verschieden sind.
  - Jede Überschrift ist kurzer Klartext (höchstens 40 Zeichen, keine Emojis oder Symbole).
  - Jede Artikelnummer kommt in genau einer Gruppe vor. Lieber wenige, größere Gruppen.

user: |
  Einträge ({{ articles | length }} insgesamt, nummeriert 1-{{ articles | length }}):

  {% for a in articles %}
  {{ a.n }}. {{ a.title }} ({{ a.source }}; Thema: {{ a.topic }}; Relevanz {{ a.relevance }}/10)
     {{ a.summary }}
  {% endfor %}
