name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Tests (LLM calls are mocked; no secrets needed)
        run: pytest
      - name: Offline demo run
        run: newsradar run -c examples/example-ag/offline.yaml
      - name: Relevance evaluation (keyword baseline, offline)
        run: >
          newsradar eval -c examples/example-ag/config.yaml
          -d evals/relevance/example-ag.jsonl --offline --min-f1 0.7
